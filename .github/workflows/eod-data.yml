name: Daily prices, all NSE and BSE stocks (bhavcopy)

# Every listed stock on NSE and BSE, last ~6 months, adjusted for corporate actions -> the `eod-data` release
# (the app build downloads it). Only the window is kept; older cache files are deleted.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/REQUEST_EOD", "scripts/fetch_eod.py", ".github/workflows/eod-data.yml"]
  schedule:
    - cron: "30 13 * * 1-5"          # 19:00 IST on weekdays (NSE posts the bhavcopy in the evening; the job waits up to an hour)

permissions:
  contents: write

concurrency:
  group: eod-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy requests
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: .eod_cache
          key: eod-${{ github.run_id }}
          restore-keys: eod-
      - name: Download NSE and BSE bhavcopies and build prices
        run: |
          set -o pipefail
          python scripts/fetch_eod.py --days 190 ${{ github.event_name == 'schedule' && '--wait-today 60' || '' }} 2>&1 | tail -60
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .eod_cache
          key: eod-${{ github.run_id }}
      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f build_eod/eod/prices.csv.gz || { echo "no output"; exit 1; }
          tar -C build_eod -cf eod_data.tar eod
          ls -la eod_data.tar
          gh release view eod-data >/dev/null 2>&1 || gh release create eod-data --title "Daily prices, all NSE and BSE stocks" --notes "Every NSE and BSE listed stock, last ~6 months of daily OHLCV, adjusted for corporate actions. Rebuilt every trading day by .github/workflows/eod-data.yml."
          gh release upload eod-data eod_data.tar --clobber
      - name: Commit report
        if: always()
        run: |
          git config user.name "tradeos-bot"
          git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/eod/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: all-stock daily prices $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
