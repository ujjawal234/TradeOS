name: Fetch market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/REQUEST", "data/REQUEST_INDICES"]   # touch to trigger a refresh
  schedule:
    - cron: "30 10 * * 1-5"          # 16:00 IST on weekdays, after market close

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy yfinance requests
      - name: Update universe and daily prices
        run: python scripts/fetch_data.py --years 15 ${{ github.event_name == 'workflow_dispatch' && '--full' || '' }}
      - name: Update every NSE index (history, P/E, P/B, dividend yield)
        continue-on-error: true
        run: python scripts/fetch_indices.py --years 15
      - name: Commit data
        run: |
          git config user.name "tradeos-bot"
          git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: refresh prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
