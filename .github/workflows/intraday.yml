name: Intraday paper trading (NSE live)

# Polls NSE's live data once a minute from 09:14 to 15:31 IST and paper-trades the agents in intraday/agents.json.
# Every 5 minutes it also snapshots every NSE stock (NSE live data) and the main indices (Yahoo) into the `live-quotes`
# branch (live/quotes.json, replaced each time) for the app and the CIO; the day's snapshots go to the `live-quotes`
# release after the close (last 20 sessions kept).
# A job may run at most 6 hours, so the run hands off to a fresh one before then and that one resumes from the
# saved state. Two schedules: if GitHub drops or delays the first, the second starts the day (a run that finds the
# day already finished, or a non-trading day, exits at once).

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test the connection to NSE (one poll, no trading)"
        type: boolean
        default: false
  schedule:
    - cron: "38 3 * * 1-5"   # 09:08 IST
    - cron: "4 4 * * 1-5"    # 09:34 IST backup (queues behind a running day)

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy requests yfinance
      - name: Paper-trade the session
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/intraday_run.py ${{ inputs.probe && '--probe' || '--max-runtime-min 330' }}
      - name: Save the day's data, positions and results
        if: always() && !inputs.probe
        run: |
          git config user.name "tradeos-bot"
          git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/intraday intraday/state intraday/results 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "intraday: $(TZ=Asia/Kolkata date +%Y-%m-%d) $([ '${{ steps.run.outputs.handoff }}' = 'true' ] && echo 'midday handoff' || echo 'results')"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Keep the day's live price snapshots (last 20 sessions)
        if: always() && !inputs.probe && steps.run.outputs.handoff != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=Asia/Kolkata date +%Y-%m-%d); f="live/history_$D.csv.gz"
          [ -f "$f" ] || { echo "no live snapshots today"; exit 0; }
          gh release view live-quotes >/dev/null 2>&1 || gh release create live-quotes --title "Live prices (5-minute snapshots)" --notes "Every NSE stock (NSE live data) and the main indices (Yahoo), every 5 minutes of each session; kept by .github/workflows/intraday.yml. history_<date>.csv.gz: asof,sym,ltp,open,high,low,prev_close,value_cr,ts"
          gh release upload live-quotes "$f" --clobber
          gh release view live-quotes --json assets -q '.assets[].name' | grep '^history_' | sort | head -n -20 | xargs -r -I{} gh release delete-asset live-quotes {} -y
      - name: Continue in a new run (6-hour job limit)
        if: steps.run.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/intraday.yml/dispatches" \
            -d '{"ref":"main"}'
