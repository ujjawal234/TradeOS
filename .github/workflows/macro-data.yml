name: Macro data (India and global)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_macro.py", ".github/workflows/macro-data.yml"]
  schedule:
    - cron: "10 12 * * *"            # 17:40 IST daily (CPI/IIP come out at 16:00 IST on release days)

permissions:
  contents: write

concurrency:
  group: macro-data
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python scripts/fetch_macro.py 2>&1 | tail -80
      - run: |
          git config user.name "tradeos-bot"
          git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/macro
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: macro $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
