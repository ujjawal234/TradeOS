name: Point-in-time universe (NSE bhavcopy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/REQUEST_PIT", "scripts/fetch_bhavcopy.py", ".github/workflows/pit-data.yml"]
  schedule:
    - cron: "50 10 * * 1-5"          # 16:20 IST on weekdays, after the day's bhavcopy is out

permissions:
  contents: write

concurrency:
  group: pit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy requests
      - name: Restore bhavcopy cache
        uses: actions/cache/restore@v4
        with:
          path: .bhav_cache
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: Download bhavcopies and build point-in-time universes
        run: |
          mkdir -p data/pit
          set -o pipefail
          python scripts/fetch_bhavcopy.py --start 2011-01-01 --cache .bhav_cache 2>&1 | tee data/pit/_log.txt
      - name: Save bhavcopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bhav_cache
          key: bhav-${{ github.run_id }}
      - name: Commit
        if: always()
        run: |
          git config user.name "tradeos-bot"
          git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/pit/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: point-in-time universe $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
