name: Probe (one-off)
on:
  push:
    branches: [main]
    paths: ["scripts/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/probe/integrated_probe.py
      - run: |
          git config user.name "tradeos-bot"; git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/_probe; git commit -m "probe: integrated filing endpoints" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
