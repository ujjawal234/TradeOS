name: Research sources probe (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_sources.py", ".github/workflows/research-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests yfinance pandas
      - run: python scripts/probe_sources.py
      - run: |
          git config user.name "tradeos-bot"; git config user.email "tradeos-bot@users.noreply.github.com"
          git add data/research/_probe.json; git commit -m "probe: research sources" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
