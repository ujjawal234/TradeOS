name: Send Telegram alerts

on:
  push:
    branches: [main]
    paths: ["alerts/latest.json"]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send today's signals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping."; exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          d = json.load(open("alerts/latest.json"))
          text = d.get("telegram_text") or d.get("push_text") or "TradeOS: no update"
          body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[:4000]}).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          print(urllib.request.urlopen(url, data=body, timeout=20).status)
          PY
